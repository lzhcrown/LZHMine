# Paths are relative to deploy/deploy_mujoco, matching the deployment layout.
# The robot starts at x=-5, y=0 on the shared flat staging area, then uses
# lateral motion to select one of the three fixed evaluation lanes.
model_path: "nezha/mjcf/scene_course.xml"
terrain_metadata_path: "nezha/mjcf/assets/nezha_terrain_course.json"
policy_path: "nezha/policy/policy.pt"
control_frequency_hz: 50
initial_base_height: 0.60
gate_log_interval: 100
history_steps: 2
history_order: auto
# Existing exports made before history metadata was added used LZHMine's old
# newest-first layout. New exports report the Apr10 oldest-first layout.
legacy_history_order: newest_first
zero_wheel_velocity_observations: true
standby_at_zero_command: true
settle_time_s: 2.0
mode_names: [wheel, leg, hybrid]
observation_scales:
  lin_vel: 2.0
  ang_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.05
joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FL_foot_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FR_foot_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RL_foot_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RR_foot_joint
default_dof_pos: [-0.10, 0.925, -1.85, 0.0, 0.10, 0.925, -1.85, 0.0, -0.10, 0.925, -1.85, 0.0, 0.10, 0.925, -1.85, 0.0]
p_gains: [150.0, 150.0, 300.0, 0.0, 150.0, 150.0, 300.0, 0.0, 150.0, 150.0, 300.0, 0.0, 150.0, 150.0, 300.0, 0.0]
d_gains: [4.0, 4.0, 4.0, 1.2, 4.0, 4.0, 4.0, 1.2, 4.0, 4.0, 4.0, 1.2, 4.0, 4.0, 4.0, 1.2]
torque_limits: [150.0, 150.0, 225.0, 56.0, 150.0, 150.0, 225.0, 56.0, 150.0, 150.0, 225.0, 56.0, 150.0, 150.0, 225.0, 56.0]
action_scale: 0.25
wheel_velocity_scale: 10.0
