# Paths are relative to deploy/deploy_mujoco.
model_path: "nezha/mjcf/scene_course.xml"
terrain_metadata_path: "nezha/mjcf/assets/nezha_terrain_course.json"
policy_path: "nezha/policy/policy.pt"
control_frequency_hz: 50
initial_base_height: 0.60
gate_log_interval: 100
# Observation dimensions, scales, clipping and history layout come from policy.pt.
# Set history_steps only to assert a required value; omit to accept model metadata.
standby_at_zero_command: true
settle_time_s: 2.0
joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FL_foot_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FR_foot_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RL_foot_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RR_foot_joint
default_dof_pos: [0.0, 0.8, -1.6, 0.0, 0.0, 0.8, -1.6, 0.0, 0.0, 0.8, -1.6, 0.0, 0.0, 0.8, -1.6, 0.0]
p_gains: [150.0, 150.0, 300.0, 0.0, 150.0, 150.0, 300.0, 0.0, 150.0, 150.0, 300.0, 0.0, 150.0, 150.0, 300.0, 0.0]
d_gains: [4.0, 4.0, 4.0, 1.2, 4.0, 4.0, 4.0, 1.2, 4.0, 4.0, 4.0, 1.2, 4.0, 4.0, 4.0, 1.2]
torque_limits: [150.0, 150.0, 225.0, 56.0, 150.0, 150.0, 225.0, 56.0, 150.0, 150.0, 225.0, 56.0, 150.0, 150.0, 225.0, 56.0]
action_scale: 0.25
wheel_velocity_scale: 10.0
